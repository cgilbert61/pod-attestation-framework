[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pod-attestation"
version = "0.1.0"
description = "POD (Proof Of Data) — Open-source Data Attestation Framework & AI Gateway Prevalidator"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
    "jsonschema>=4.20.0",
    "pydantic>=2.5.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.25",
    "httpx>=0.26.0",
    "pyjwt>=2.8.0",
    "openpyxl>=3.1.2",
    "psycopg2-binary>=2.9.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
full = [
    "presidio-analyzer>=2.2.35",
    "presidio-anonymizer>=2.2.35",
    "tika>=2.6.0",
    "psycopg2-binary>=2.9.9",
    "sigstore-protobuf-specs>=0.3.0",
]

[project.scripts]
pod = "registry.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["registry*", "engine*", "snapshot*", "prevalidator*", "conformance*"]

[tool.pytest.ini_options]
testpaths = ["tests", "conformance"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
